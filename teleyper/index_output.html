<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命令行终端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 12px 14px;
            max-width: 780px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #30363d;
        }


        .date-counter {
            color: #58a6ff;
            font-size: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .terminal-body {
            line-height: 1.25;
            font-size: 13px;
        }

        .prompt {
            color: #58a6ff;
            margin-right: 4px;
        }

        .command {
            color: #c9d1d9;
        }

        .command-history {
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 6px;
            padding: 6px 8px;
            background-color: #0d1117;
            border-radius: 2px;
        }

        .command-line {
            display: flex;
            align-items: center;
            margin-top: 2px;
        }

        .command-input {
            background-color: transparent;
            border: none;
            color: #c9d1d9;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            flex: 1;
            padding: 0;
            margin: 0;
            caret-color: #c9d1d9;
            width: 100%;
        }

        .command-input::placeholder {
            color: #6e7681;
        }

        .command-input::selection {
            background-color: #264f78;
            color: #c9d1d9;
        }

        /* 块状光标效果 - 使用caret-shape */
        @supports (caret-shape: block) {
            .command-input {
                caret-shape: block;
            }
        }

        .command-history-item {
            margin: 0;
            padding: 0;
        }

        .command-history-item .command-line {
            margin: 0;
        }

        .api-response {
            margin-top: 0;
            padding-left: 2ch;
            color: #7ee787;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .api-error {
            color: #f85149;
        }

        .api-error::before {
            content: ":( ERROR: ";
            color: #f85149;
            font-weight: bold;
        }


        .command-history::-webkit-scrollbar {
            width: 8px;
        }

        .command-history::-webkit-scrollbar-track {
            background: #0d1117;
        }

        .command-history::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .command-history::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <div class="date-counter" id="dateCounter"></div>
        </div>
        <div class="terminal-body">
            <div class="command-history" id="commandHistory">
            </div>
            <div class="command-line">
                <span class="prompt">$</span>
                <input type="text" 
                       class="command-input" 
                       id="commandInput" 
                       placeholder=""
                       autocomplete="off">
            </div>
        </div>
    </div>
